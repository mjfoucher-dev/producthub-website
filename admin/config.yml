# Settings for the ProductHub Victoria editor at producthub.info/admin (Sveltia CMS).
# Docs: https://sveltiacms.app/docs
#
# How publishing works (publish_mode: editorial_workflow):
#   Save          -> the post is saved as a draft on its own branch and pull request.
#                    Vercel builds a preview of the whole site with the post in it.
#   Status        -> move it from Draft to In Review to Ready on the Workflow page.
#   Publish       -> merges the pull request; Vercel puts it on producthub.info a minute later.
# Nothing reaches the live site until someone presses Publish.

backend:
  name: github
  repo: mjfoucher-dev/producthub-website
  branch: main
  # Sign-in runs through our own Vercel function (api/auth.mjs), using the GitHub OAuth app
  # in Vercel's GITHUB_OAUTH_CLIENT_ID and GITHUB_OAUTH_CLIENT_SECRET settings.
  # base_url is set to this site's own address in admin/index.html.
  auth_endpoint: api/auth

publish_mode: editorial_workflow

app_title: ProductHub Victoria editor
site_url: https://producthub.info
logo:
  src: /android-chrome-192.png

media_folder: assets/posts
public_folder: /assets/posts

slug:
  encoding: ascii
  clean_accents: true
  maxlength: 60

collections:
  - name: newsletter
    label: Newsletter
    label_singular: Newsletter issue
    description: Every issue appears at producthub.info/newsletter. Send the email itself from Kit.
    folder: content/posts
    filter: { field: type, value: newsletter }
    create: true
    # The file name, and the web address, is issue-<number>: /newsletter/issue-2
    slug:
      template: "issue-{{issue}}"
      editable: false
    preview_path: /newsletter/{{slug}}
    summary: "#{{issue}} · {{title}}"
    sortable_fields: [date, issue, title]
    fields:
      - { name: type, widget: hidden, default: newsletter }
      - { name: title, label: Title, widget: string }
      - { name: issue, label: Issue number, widget: number, value_type: int, min: 1 }
      - { name: date, label: Date, widget: datetime, type: date, format: YYYY-MM-DD, default: "{{now}}",
          hint: "Issues are listed newest first by this date." }
      - { name: description, label: Summary, widget: text,
          hint: "One or two sentences. Shown in the archive, in Google results and in link previews." }
      - { name: author, label: Author, widget: string, default: Michael & Danijel }
      - { name: image, label: Link preview image, widget: image, required: false,
          hint: "Optional. Shown when the issue is shared on LinkedIn or Slack. Landscape, about 1200 x 630." }
      - { name: imageAlt, label: Image description, widget: string, required: false,
          hint: "What the image shows, for screen readers." }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: body, label: Issue, widget: richtext,
          hint: "To credit a quote, press Shift+Enter at the end of it and start the new line with an em dash (—). The first quote in a row becomes the big navy card." }

  - name: blog
    label: Blog
    label_singular: Blog post
    description: Posts appear at producthub.info/blog.
    folder: content/posts
    filter: { field: type, value: blog }
    create: true
    # The file name is the web address: /blog/why-we-keep-it-small. Pick it when you create
    # the post; it can't change afterwards, so links people shared keep working.
    slug:
      template: "{{title}}"
      editable: [create]
    preview_path: /blog/{{slug}}
    sortable_fields: [date, title, author]
    fields:
      - { name: type, widget: hidden, default: blog }
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, type: date, format: YYYY-MM-DD, default: "{{now}}",
          hint: "Posts are listed newest first by this date." }
      - { name: description, label: Summary, widget: text,
          hint: "One or two sentences. Shown in the blog list, in Google results and in link previews." }
      - { name: author, label: Author, widget: string, default: Michael Foucher,
          hint: "For two authors, write “Michael & Danijel”." }
      - { name: image, label: Link preview image, widget: image, required: false,
          hint: "Optional. Shown when the post is shared on LinkedIn or Slack. Landscape, about 1200 x 630." }
      - { name: imageAlt, label: Image description, widget: string, required: false,
          hint: "What the image shows, for screen readers." }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: body, label: Post, widget: richtext,
          hint: "To credit a quote, press Shift+Enter at the end of it and start the new line with an em dash (—). The first quote in a row becomes the big navy card." }

  - name: events
    label: Events
    label_singular: Event
    description: Gatherings on the homepage. Each one moves from Upcoming to Past by itself once it ends. RSVPs happen on Luma.
    folder: content/events
    format: yaml
    extension: yml
    create: true
    slug:
      template: "{{start | date('YYYY-MM-DD')}}-{{title}}"
      editable: false
    preview_path: /#events
    summary: "{{start | date('YYYY-MM-DD')}} · {{title}}"
    sortable_fields: [start, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: start, label: Starts, widget: datetime, format: "YYYY-MM-DDTHH:mm:ssZ",
          hint: "In your computer's time zone (Victoria time for Michael and Danijel)." }
      - { name: end, label: Ends, widget: datetime, format: "YYYY-MM-DDTHH:mm:ssZ", required: false }
      - { name: venue, label: Venue, widget: string, hint: "Street address. The homepage adds “, Victoria” after it." }
      - { name: summary, label: Summary, widget: text }
      - name: agenda
        label: Agenda
        label_singular: Agenda item
        widget: list
        required: false
        summary: "{{time}} {{item}}"
        hint: Shown in the “Next gathering” box at the top of the homepage.
        fields:
          - { name: time, label: Time, widget: string, hint: "Like 6:00" }
          - { name: item, label: What happens, widget: string }
      - { name: luma, label: Luma link, widget: string, hint: "The event page on luma.com, where people RSVP." }
      - { name: free, label: Free event, widget: boolean, default: true, required: false, hint: "Shown on the event page and told to Google." }
      - { name: image, label: Photo, widget: image, required: false, media_folder: /assets/posts, public_folder: /assets/posts, hint: "Optional. Shown on the event's page and in link previews." }
      - { name: imageAlt, label: Photo description, widget: string, required: false }
      - { name: recap, label: Recap, widget: markdown, required: false, hint: "Optional. After the event: what the room learned. Shows on the event's own page at /events/…" }
      - { name: related, label: Related link, widget: string, required: false, hint: "Optional. A page on this site, like /newsletter/issue-1." }
      - { name: relatedLabel, label: Related link text, widget: string, required: false, hint: "Like “Read the recap in Issue #1”." }

  - name: resources
    label: Resources
    label_singular: Resource
    description: Briefs and take-homes listed at producthub.info/resources.
    folder: content/resources
    create: true
    slug:
      template: "{{date | date('YYYY-MM-DD')}}-{{title}}"
      editable: [create]
    preview_path: /resources
    sortable_fields: [date, title]
    media_folder: /resources
    public_folder: /resources
    fields:
      - { name: title, label: Title, widget: string }
      - { name: kind, label: Label, widget: string, required: false, hint: "Small label above the title, like “Product brief 02”." }
      - { name: date, label: Date, widget: datetime, type: date, format: YYYY-MM-DD, default: "{{now}}" }
      - { name: session, label: From the session, widget: string, required: false, hint: "Like “Fall Event 2026”." }
      - { name: description, label: Summary, widget: text }
      - { name: file, label: File, widget: file, hint: "The PDF (or other file) people download." }
      - { name: thumb, label: Cover image, widget: image, required: false, hint: "A picture of the first page." }
      - { name: related, label: Related link, widget: string, required: false, hint: "Optional. A page on this site, like /newsletter/issue-1." }
      - { name: relatedLabel, label: Related link text, widget: string, required: false }
      - { name: body, label: Summary page, widget: markdown, required: false, hint: "Optional but recommended: the key points in words, shown on the resource's own page (/resources/…). Google and AI search read this; they can't read a PDF well." }

  - name: pages
    label: Pages
    description: The words on the homepage and at the top of the Newsletter, Blog and Resources pages. The layout and colours stay as they are.
    files:
      - name: home
        label: Homepage
        file: content/pages/home.yml
        preview_path: /
        fields:
          - name: hero
            label: Top of the page
            widget: object
            fields:
              - { name: eyebrow, label: Small label, widget: string }
              - { name: title, label: Headline, widget: string, hint: 'Wrap words in asterisks to show them in coral, like: A room for the people who \*ship software\* on Vancouver Island.' }
              - { name: lede, label: Intro, widget: text }
              - { name: primaryButton, label: Coral button text, widget: string, hint: "Goes to the newsletter sign-up." }
              - { name: secondaryButton, label: Outline button text, widget: string, hint: "Goes to What we do." }
          - name: whatWeDo
            label: What we do
            widget: object
            fields:
              - { name: eyebrow, label: Small label, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: statement, label: Statement, widget: text, hint: 'Wrap words in two asterisks to make them bold, like \*\*in small groups\*\*.' }
              - { name: promiseLabel, label: Promise label, widget: string }
              - { name: promise, label: Promise, widget: text }
              - name: values
                label: Values
                label_singular: Value
                widget: list
                summary: "{{title}}"
                fields:
                  - { name: title, label: Value, widget: string }
                  - { name: text, label: What it means, widget: text }
                  - { name: notHere, label: "“Not here” list", widget: string, required: false }
          - name: events
            label: Events section
            widget: object
            hint: The events themselves are in Events.
            fields:
              - { name: eyebrow, label: Small label, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: intro, label: Intro, widget: text }
              - { name: lumaCalendar, label: Luma calendar link, widget: string }
              - { name: noUpcoming, label: Text when nothing is scheduled, widget: text }
              - { name: noPast, label: Text before the first event, widget: text }
              - { name: noNextTitle, label: Top box heading when nothing is scheduled, widget: string }
              - { name: noNextText, label: Top box text when nothing is scheduled, widget: string }
          - name: latest
            label: Latest posts section
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
          - name: founders
            label: Founders
            widget: object
            fields:
              - { name: eyebrow, label: Small label, widget: string }
              - { name: heading, label: Heading, widget: string }
              - name: people
                label: People
                label_singular: Person
                widget: list
                summary: "{{name}}"
                fields:
                  - { name: name, label: Name, widget: string }
                  - { name: role, label: Role, widget: string }
                  - { name: photo, label: Photo, widget: image, media_folder: /assets/founders, public_folder: /assets/founders, hint: "Square works best. It's shown in black and white." }
                  - { name: bio, label: Bio, widget: text }
                  - { name: linkedin, label: LinkedIn link, widget: string, required: false }
                  - { name: email, label: Email address, widget: string, required: false }
                  - { name: emailLabel, label: Email link text, widget: string, required: false, hint: "Like “Email Michael”." }
          - name: slack
            label: Slack
            widget: object
            fields:
              - { name: eyebrow, label: Small label, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: intro, label: Intro, widget: text }
              - { name: steps, label: Steps, label_singular: Step, widget: list, hint: "Numbered 01, 02, 03 automatically." }
              - { name: button, label: Button text, widget: string }
              - { name: finePrint, label: Fine print, widget: string }
          - name: newsletter
            label: Newsletter sign-up
            widget: object
            hint: This sign-up box also appears at the bottom of every post.
            fields:
              - { name: eyebrow, label: Small label, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: intro, label: Intro, widget: text }
              - { name: button, label: Button text, widget: string }
              - { name: finePrint, label: Fine print, widget: string, hint: "“Read past issues” is added after it." }
          - name: footer
            label: Footer
            widget: object
            fields:
              - { name: tagline, label: Tagline, widget: string, hint: "Shown before “© year ProductHub Victoria”." }
          - name: seo
            label: Search and sharing
            widget: object
            fields:
              - { name: title, label: Browser tab and Google title, widget: string, hint: "Keep it under about 60 characters, with the words people search for." }
              - { name: description, label: Google description, widget: text }
              - { name: shareDescription, label: Link preview description, widget: text, hint: "Shown when the site is shared on LinkedIn or Slack." }
      - name: about
        label: About page
        file: content/pages/about.yml
        preview_path: /about
        fields:
          - { name: title, label: Browser tab and Google title, widget: string }
          - { name: description, label: Google description, widget: text }
          - { name: heading, label: Heading, widget: string }
          - { name: intro, label: Intro, widget: text }
          - name: sections
            label: Sections
            label_singular: Section
            widget: list
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Text, widget: text, hint: 'Links work like [text](https://…).' }
          - name: faq
            label: Questions and answers
            label_singular: Question
            widget: list
            hint: Also given to Google and AI search tools as an FAQ. Start each answer with the direct answer.
            fields:
              - { name: q, label: Question, widget: string }
              - { name: a, label: Answer, widget: text, hint: 'Links work like [text](https://…).' }
      - name: archives
        label: Newsletter, Blog, Events and Resources pages
        file: content/pages/archives.yml
        preview_path: /newsletter
        fields:
          - name: newsletter
            label: Newsletter page
            widget: object
            fields:
              - { name: title, label: Browser tab title, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: intro, label: Intro, widget: text }
              - { name: empty, label: Text before the first issue, widget: text }
          - name: blog
            label: Blog page
            widget: object
            fields:
              - { name: title, label: Browser tab title, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: intro, label: Intro, widget: text }
              - { name: empty, label: Text before the first post, widget: text }
          - name: events
            label: Events page (/events)
            widget: object
            fields:
              - { name: title, label: Browser tab title, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: intro, label: Intro, widget: text }
              - { name: empty, label: Text before the first event, widget: text }
          - name: resources
            label: Resources page
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: intro, label: Intro, widget: text }
              - { name: empty, label: Text before the first resource, widget: text }
