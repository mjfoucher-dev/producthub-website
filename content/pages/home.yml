slack:
  eyebrow: Slack
  heading: Keep the conversation going between events.
  intro: A members-only Slack for people who build software on the Island. Share what you're working on, ask the room, and hear about gatherings first.
  steps:
    - Tell us a little about what you work on.
    - A host reviews every request, usually within a few days.
    - Your invite arrives by email from Slack.
  button: Request an invite
  finePrint: "Small on purpose: no recruiters or vendor pitches."
newsletter:
