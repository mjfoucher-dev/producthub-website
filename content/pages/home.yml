# Homepage text. Edit in the web editor at producthub.info/admin (Pages → Homepage).
# Layout and styling live in index.html; this file only holds the words, links and photos.
seo:
  title: ProductHub Victoria · Product community on Vancouver Island
  description: A small room for the people who make software products on Vancouver Island. Small gatherings where peers show how they really build, test and ship.
  shareDescription: A small room for the people who make software products on Vancouver Island.
hero:
  eyebrow: Victoria, BC · Vancouver Island
  title: A room for the people who *ship software* on Vancouver Island.
  lede: Product managers, designers, engineers, testers and everyone else in the room when it ships. We meet in small groups to show how the work actually gets done.
  primaryButton: Get the newsletter
  secondaryButton: What we do
whatWeDo:
  eyebrow: What we do
  heading: Show the real work. Leave with something you can use Monday.
  statement: We're the people who make software products on Vancouver Island. We get together, **in small groups**, to show each other how the work actually gets done, what's changing, and what we're learning as we go.
  promiseLabel: What you get
  promise: A small, trusted room of Island product makers where you'll see how peers really build, test and ship, and go home with something you can use Monday.
  values:
    - title: Show the real work, and leave it behind.
      text: "Share what you actually built and how you actually decided, messy parts included. Every gathering leaves something the group keeps: a workflow, a template, a lesson."
      notHere: keynotes, vendor pitches, socials with nothing to show for them.
    - title: Everyone in the room when it ships.
      text: Product is a team sport. Designers, engineers, testers, support and PMs get the same seat and the same mic.
      notHere: PM-only circles, seniority hierarchies.
    - title: Say the true thing.
      text: What failed matters as much as what worked, especially now, when everyone is pretending they've figured out AI.
      notHere: hype, humblebragging, sanitized case studies.
    - title: Small on purpose.
      text: We'd rather have twenty people who know each other's work than two hundred who don't. Trust is the product.
      notHere: growth for its own sake.
    - title: Island first, open door.
      text: Our members are here. Guests can be from anywhere, as long as they come to share how they work rather than sell what they make.
      notHere: sponsor-driven programming.
