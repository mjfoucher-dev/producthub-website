founders:
  eyebrow: Founders
  heading: The two people holding the door open
  people:
    - name: Michael J Foucher
      role: Co-founder & host
      photo: /assets/founders/michael.jpg
      bio: Michael has spent more than 25 years launching and scaling web, mobile and desktop products, including web browsers, in large enterprises and startups alike. His background spans marketplaces, e-commerce, customer success and agile teams. A UVic economics and MPA grad, he started ProductHub so the people building software on the Island have a room to show how the work really gets done.
      linkedin: https://www.linkedin.com/in/michaelfoucher
      email: michael@producthub.info
      emailLabel: Email Michael
    - name: Danijel Coric
      role: Co-founder & host
      photo: /assets/founders/danijel.jpg
      bio: "Danijel has more than 18 years of experience leading M&A, integration and transformation programs across private equity, technology platforms, insurance and global fintech. He specializes in technology and product due diligence: finding the value drivers that matter and turning them into plans teams can actually deliver. He co-founded ProductHub to give the Island's product people a place to learn from each other's real work."
